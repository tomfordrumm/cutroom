# A tag vX.Y.Z publishes ghcr.io/<owner>/cutroom:X.Y.Z and :latest for amd64 and arm64.
# The tag must match package.json. OpenRoughCut is built in at the commit in orc.ref.
# Installs see the new version in Settings and run update.sh.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Version and names
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cutroom"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "orc=$(tr -d '[:space:]' < orc.ref)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: tomfordrumm/OpenRoughCut
          ref: ${{ steps.meta.outputs.orc }}
          path: orc

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Tests run against the image they ship in, as in development.
      - name: Build for tests (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: orc=./orc
          platforms: linux/amd64
          load: true
          tags: cutroom:ci
          build-args: CUTROOM_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/src:/opt/cutroom/src:ro" -v "$PWD/test:/opt/cutroom/test:ro" \
            -v "$PWD/packs:/opt/cutroom/packs:ro" -v "$PWD/instructions:/opt/cutroom/instructions:ro" \
            -v "$PWD/gfx/src:/opt/cutroom/gfx/src:ro" -v "$PWD/.github:/opt/cutroom/.github:ro" \
            -v "$PWD/Dockerfile:/opt/cutroom/Dockerfile:ro" -v "$PWD/orc.ref:/opt/cutroom/orc.ref:ro" \
            -v "$PWD/install.sh:/opt/cutroom/install.sh:ro" -v "$PWD/update.sh:/opt/cutroom/update.sh:ro" \
            -w /opt/cutroom cutroom:ci -c 'node --test test/*.test.js'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: orc=./orc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: CUTROOM_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
