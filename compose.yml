# Cutroom: web app + editing worker (+ Caddy for HTTPS on a real server).
# Settings come from .env (see .env.example); install.sh writes it.
name: cutroom

x-cutroom: &cutroom
  image: ${CUTROOM_IMAGE:-cutroom:local}
  restart: unless-stopped
  env_file: .env
  volumes:
    - cutroom-data:/data

services:
  app:
    <<: *cutroom
    command: ["node", "src/server.js"]
    ports:
      - "${CUTROOM_BIND:-127.0.0.1}:${CUTROOM_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *cutroom
    command: ["node", "src/worker.js"]
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    profiles: ["https"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${CUTROOM_DOMAIN:-localhost}", "--to", "app:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  cutroom-data:
  caddy-data:
